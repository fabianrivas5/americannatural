const SCENES=[sc1,sc2,sc3,sc4,sc5,sc6];
function render(t){

 if(i>0&&lt<0.12)h+=`<div class="abs" style="inset:0;background:#fff;opacity:${0.5*(1-lt/0.12)}"></div>`;
 h+=yellow(t);

 document.getElementById('stage').innerHTML=h;
}
