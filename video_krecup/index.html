<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Anton;src:url(fonts/anton.woff2)}
@font-face{font-family:Pop;font-weight:800;src:url(fonts/pop800.woff2)}
@font-face{font-family:Pop;font-weight:900;src:url(fonts/pop900.woff2)}
html,body{margin:0;background:#000}
canvas{display:block}
</style></head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="words.js"></script><script src="prod.js"></script>
<script>
const W=1080,H=1920,c=document.getElementById('c'),x=c.getContext('2d');
const C={navy:'#071636',navy2:'#0c2a6b',blue:'#1f56e0',sky:'#5fa8ff',gold:'#f5c518',gold2:'#d9a300',white:'#ffffff',red:'#ff3b3b',green:'#26d07c',slate:'#2b4a94',grey:'#9fb3d9'};
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const P=(t,a,d=0.35)=>clamp((t-a)/d);
const eo=p=>1-Math.pow(1-p,3);
const eb=p=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(p-1,3)+c1*Math.pow(p-1,2)};
const pop=(t,a,d=0.4)=>{const p=P(t,a,d);return p<=0?0:eb(p)};
const lerp=(a,b,p)=>a+(b-a)*p;
function rnd(i){let s=Math.sin(i*12.9898+78.233)*43758.5453;return s-Math.floor(s)}

const prod=new Image();prod.src=PROD_SRC;
// grain
const grains=[];for(let g=0;g<4;g++){const o=document.createElement('canvas');o.width=540;o.height=960;const oc=o.getContext('2d');const d=oc.createImageData(540,960);for(let i=0;i<d.data.length;i+=4){const v=rnd(i*0.37+g*999)*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255}oc.putImageData(d,0,0);grains.push(o)}

function rr(X,Y,w,h,r){x.beginPath();x.roundRect(X,Y,w,h,r)}
function txt(s,X,Y,size,col,opt={}){x.save();x.font=(opt.w||900)+' '+size+'px '+(opt.f||'Pop');x.textAlign=opt.a||'center';x.textBaseline='middle';
 if(opt.ls)x.letterSpacing=opt.ls+'px';
 if(opt.sh){x.shadowColor='rgba(0,0,0,.55)';x.shadowBlur=opt.sh;x.shadowOffsetY=opt.sh/3}
 if(opt.st){x.lineJoin='round';x.lineWidth=opt.st;x.strokeStyle=opt.stc||'#000';x.strokeText(s,X,Y)}
 x.fillStyle=col;x.fillText(s,X,Y);x.restore()}
function sc(X,Y,s,fn){if(s<=0.001)return;x.save();x.translate(X,Y);x.scale(s,s);fn();x.restore()}
function pill(s,X,Y,size,bg,fg,k=1,opt={}){if(k<=0.001)return;sc(X,Y,k,()=>{x.font='900 '+size+'px '+(opt.f||'Pop');const w=x.measureText(s).width+size*1.1,h=size*1.55;
 x.save();x.shadowColor='rgba(0,0,0,.45)';x.shadowBlur=24;x.shadowOffsetY=8;x.fillStyle=bg;rr(-w/2,-h/2,w,h,h/2);x.fill();x.restore();
 txt(s,0,size*0.04,size,fg,{f:opt.f})})}
function card(X,Y,w,h,k=1,col='rgba(255,255,255,.08)',bd='rgba(255,255,255,.18)'){if(k<=0)return;sc(X,Y,k,()=>{x.save();x.shadowColor='rgba(0,0,0,.4)';x.shadowBlur=30;x.fillStyle=col;rr(-w/2,-h/2,w,h,36);x.fill();x.restore();x.strokeStyle=bd;x.lineWidth=3;rr(-w/2,-h/2,w,h,36);x.stroke()})}

// ---------- background
function bg(t,fi){const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0d2a6e');g.addColorStop(.55,'#081a45');g.addColorStop(1,'#040d24');x.fillStyle=g;x.fillRect(0,0,W,H);
 // hex grid
 x.save();x.strokeStyle='rgba(120,170,255,.10)';x.lineWidth=2;const R=70,dy=t*12%(R*1.732);
 for(let row=-1;row<18;row++)for(let col=-1;col<9;col++){const cx=col*R*1.5,cy=row*R*1.732+(col%2?R*0.866:0)-dy;x.beginPath();for(let k=0;k<6;k++){const a=Math.PI/3*k;x.lineTo(cx+R*Math.cos(a)*.98,cy+R*Math.sin(a)*.98)}x.closePath();x.stroke()}
 x.restore();
 // glow
 const rg=x.createRadialGradient(W/2,820,50,W/2,820,900);rg.addColorStop(0,'rgba(60,120,255,.28)');rg.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=rg;x.fillRect(0,0,W,H);
 // dust particles
 for(let i=0;i<40;i++){const px=rnd(i)*W,py=(rnd(i+50)*H-t*(20+rnd(i+9)*40))%H;x.fillStyle='rgba(180,210,255,'+(0.15+rnd(i+3)*0.25)+')';x.beginPath();x.arc(px,py<0?py+H:py,1.5+rnd(i+7)*2.5,0,7);x.fill()}
}
function post(fi){x.save();x.globalAlpha=0.07;x.globalCompositeOperation='overlay';x.drawImage(grains[fi%4],0,0,W,H);x.restore();
 const v=x.createRadialGradient(W/2,H/2,H*0.3,W/2,H/2,H*0.75);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.55)');x.fillStyle=v;x.fillRect(0,0,W,H)}

// ---------- primitives
function person(X,yF,h,col,o={}){const r=h*0.075;x.save();x.fillStyle=col;x.translate(X,yF);
 const look=o.look||0,arms=o.arms||0,tilt=o.tilt||0;
 x.save();x.translate(0,-h+r*1.05);x.rotate(tilt);x.beginPath();x.arc(look*r*0.25,-look*r*0.2,r,0,7);x.fill();x.restore();
 const tw=h*0.25,tt=-h+2.15*r,tb=-h*0.47;rr(-tw/2,tt,tw,tb-tt,tw*0.35);x.fill();
 const lw=h*0.095;rr(-tw/2+2,tb-10,lw,-tb+10,lw/2);x.fill();rr(tw/2-lw-2,tb-10,lw,-tb+10,lw/2);x.fill();
 const aw=h*0.075,al=h*0.33;
 [[-1],[1]].forEach(([s])=>{x.save();x.translate(s*(tw/2-aw*0.3),tt+aw*0.6);
  let a=s*0.12;if(arms==1)a=s*2.5;if(arms==2)a=s*(Math.PI-0.15);x.rotate(a);rr(-aw/2,-aw/2,aw,al,aw/2);x.fill();
  if(arms==1){x.translate(0,al-aw/2);x.rotate(-s*2.0);rr(-aw/2,-aw/2,aw,al*0.75,aw/2);x.fill()}
  x.restore()});
 x.restore()}
function X_(X,Y,s,k=1){sc(X,Y,k,()=>{x.strokeStyle=C.red;x.lineWidth=s*0.22;x.lineCap='round';x.beginPath();x.moveTo(-s,-s);x.lineTo(s,s);x.moveTo(s,-s);x.lineTo(-s,s);x.stroke()})}
function check(X,Y,s,k=1){sc(X,Y,k,()=>{x.fillStyle=C.green;x.beginPath();x.arc(0,0,s,0,7);x.fill();x.strokeStyle='#fff';x.lineWidth=s*0.22;x.lineCap='round';x.lineJoin='round';x.beginPath();x.moveTo(-s*.45,0);x.lineTo(-s*.1,s*.35);x.lineTo(s*.5,-s*.35);x.stroke()})}
function dna(X,Y,h,t,col1=C.sky,col2=C.gold,fill=1){const n=14;x.save();x.lineCap='round';
 for(let i=0;i<n;i++){const yy=Y-h/2+h*i/(n-1);const ph=t*2.2+i*0.55;const a=Math.sin(ph)*h*0.16,b=-a;const on=i/(n-1)<=fill;
  x.strokeStyle=on?'rgba(255,255,255,.55)':'rgba(255,255,255,.12)';x.lineWidth=7;x.beginPath();x.moveTo(X+a,yy);x.lineTo(X+b,yy);x.stroke();
  const z=Math.cos(ph);x.fillStyle=on?col1:'#33466e';x.beginPath();x.arc(X+a,yy,10+z*3,0,7);x.fill();x.fillStyle=on?col2:'#33466e';x.beginPath();x.arc(X+b,yy,10-z*3,0,7);x.fill()}
 x.restore()}
function gauge(X,Y,r,v,label,sub){x.save();x.lineCap='round';x.lineWidth=r*0.2;
 x.strokeStyle='rgba(255,255,255,.12)';x.beginPath();x.arc(X,Y,r,Math.PI,0);x.stroke();
 const g=x.createLinearGradient(X-r,0,X+r,0);g.addColorStop(0,C.red);g.addColorStop(.5,C.gold);g.addColorStop(1,C.green);x.strokeStyle=g;x.beginPath();x.arc(X,Y,r,Math.PI,Math.PI+Math.PI*clamp(v));x.stroke();
 const a=Math.PI+Math.PI*clamp(v);x.strokeStyle='#fff';x.lineWidth=12;x.beginPath();x.moveTo(X,Y);x.lineTo(X+Math.cos(a)*r*0.8,Y+Math.sin(a)*r*0.8);x.stroke();x.fillStyle='#fff';x.beginPath();x.arc(X,Y,20,0,7);x.fill();
 x.restore();if(label)txt(label,X,Y+70,64,'#fff',{f:'Anton',w:400});if(sub)txt(sub,X,Y+135,38,C.grey,{w:800})}
function head(X,Y,s,col=C.slate){x.save();x.fillStyle=col;x.beginPath();x.ellipse(X,Y,s*0.8,s,0,0,7);x.fill();rr(X-s*0.35,Y+s*0.7,s*0.7,s*0.9,s*0.2);x.fill();
 x.beginPath();x.ellipse(X,Y-s*0.15,s*0.55,s*0.45,0,0,7);x.fillStyle='rgba(255,140,170,.35)';x.fill();x.restore()}
function ruler(X,Y0,Y1,w=90){x.save();x.fillStyle='rgba(245,197,24,.95)';rr(X,Y1,w,Y0-Y1,10);x.fill();x.strokeStyle='#5b4300';x.lineWidth=3;
 for(let y=Y0,i=0;y>Y1;y-=24,i++){x.beginPath();x.moveTo(X,y);x.lineTo(X+(i%5==0?w*0.6:w*0.3),y);x.stroke()}x.restore()}
function lock(X,Y,s,open=0,col=C.gold){x.save();x.translate(X,Y);x.strokeStyle=col;x.lineWidth=s*0.18;x.beginPath();x.arc(0,-s*0.35-open*s*0.5,s*0.5,Math.PI,0);x.lineTo(s*0.5,-s*0.1-open*s*0.5);x.moveTo(-s*0.5,-s*0.35-open*s*0.5);x.lineTo(-s*0.5,-s*0.1-(open>0?open*s*0.5:0));x.stroke();
 x.fillStyle=col;rr(-s*0.8,-s*0.2,s*1.6,s*1.2,s*0.2);x.fill();x.fillStyle=C.navy;x.beginPath();x.arc(0,s*0.25,s*0.15,0,7);x.fill();rr(-s*0.06,s*0.25,s*0.12,s*0.35,4);x.fill();x.restore()}
function moon(X,Y,r,col=C.gold){x.save();x.beginPath();x.arc(X,Y,r,0,7);x.arc(X+r*0.45,Y-r*0.3,r*0.85,0,7,true);x.fillStyle=col;x.fill('evenodd');x.restore()}
function crescent(X,Y,r,col=C.gold){x.save();x.beginPath();x.arc(X,Y,r,Math.PI*0.32,Math.PI*1.68,false);x.arc(X+r*0.55,Y,r*0.82,Math.PI*1.5,Math.PI*0.5,true);x.closePath();x.fillStyle=col;x.fill();x.restore()}
function burger(X,Y,s){x.save();x.translate(X,Y);x.fillStyle='#e8a33a';x.beginPath();x.ellipse(0,-s*0.3,s,s*0.6,0,Math.PI,0);x.fill();x.fillStyle='#5a2d0c';rr(-s*1.05,-s*0.3,s*2.1,s*0.35,s*0.15);x.fill();x.fillStyle='#4caf50';rr(-s*1.1,s*0.05,s*2.2,s*0.15,8);x.fill();x.fillStyle='#e8a33a';rr(-s,s*0.2,s*2,s*0.4,s*0.2);x.fill();x.restore()}
function capsule(X,Y,s,a=0.6){x.save();x.translate(X,Y);x.rotate(a);x.fillStyle=C.gold;rr(-s,-s*0.42,s,s*0.84,[s*0.42,0,0,s*0.42]);x.fill();x.fillStyle='#fff';rr(0,-s*0.42,s,s*0.84,[0,s*0.42,s*0.42,0]);x.fill();x.restore()}
function dumbbell(X,Y,s,a=0){x.save();x.translate(X,Y);x.rotate(a);x.fillStyle='#cfd8ea';rr(-s,-s*0.08,s*2,s*0.16,6);x.fill();x.fillStyle='#e6ecf7';[-1,1].forEach(k=>{rr(k*s*0.75-s*0.13,-s*0.45,s*0.26,s*0.9,10);x.fill();rr(k*s*0.98-s*0.08,-s*0.3,s*0.16,s*0.6,8);x.fill()});x.restore()}
function molecule(X,Y,s,t,col=C.sky){x.save();x.translate(X,Y);x.rotate(t*0.3);x.strokeStyle='#fff';x.lineWidth=8;const pts=[];for(let k=0;k<6;k++){const a=Math.PI/3*k;pts.push([Math.cos(a)*s,Math.sin(a)*s])}
 x.beginPath();pts.forEach((p,i)=>i?x.lineTo(...p):x.moveTo(...p));x.closePath();x.stroke();
 [[0,1.9],[3,1.9]].forEach(([i,m])=>{x.beginPath();x.moveTo(...pts[i]);x.lineTo(pts[i][0]*m,pts[i][1]*m);x.stroke();x.fillStyle=C.gold;x.beginPath();x.arc(pts[i][0]*m,pts[i][1]*m,s*0.22,0,7);x.fill()});
 pts.forEach((p,i)=>{x.fillStyle=i%2?col:'#fff';x.beginPath();x.arc(p[0],p[1],s*0.2,0,7);x.fill()});x.restore()}
function zinc(X,Y,s){x.save();x.translate(X,Y);const g=x.createLinearGradient(-s,-s,s,s);g.addColorStop(0,'#e9eef7');g.addColorStop(1,'#8d9bb5');x.fillStyle=g;x.shadowColor='rgba(0,0,0,.4)';x.shadowBlur=30;rr(-s,-s,2*s,2*s,s*0.2);x.fill();x.shadowBlur=0;
 txt('30',-s*0.6,-s*0.7,s*0.28,'#223',{w:800,a:'left'});txt('Zn',0,s*0.02,s*0.95,'#0b1d4a',{w:900});txt('ZINC',0,s*0.68,s*0.26,'#223',{w:800});x.restore()}
function bone(X,Y,s,glow=0,a=0){x.save();x.translate(X,Y);x.rotate(a);if(glow){x.shadowColor='rgba(245,197,24,'+glow+')';x.shadowBlur=60*glow}x.fillStyle='#f4efe2';
 rr(-s,-s*0.16,2*s,s*0.32,s*0.1);x.fill();[[-1,-1],[-1,1],[1,-1],[1,1]].forEach(([i,j])=>{x.beginPath();x.arc(i*s,j*s*0.18,s*0.24,0,7);x.fill()});x.restore()}
function wand(X,Y,s,t){x.save();x.translate(X,Y);x.rotate(-0.7+Math.sin(t*6)*0.15);x.fillStyle='#222';rr(-s*0.06,0,s*0.12,s*1.4,6);x.fill();x.fillStyle='#fff';rr(-s*0.06,0,s*0.12,s*0.25,6);x.fill();
 x.fillStyle=C.gold;x.beginPath();for(let k=0;k<10;k++){const r=k%2?s*0.15:s*0.36,a=-Math.PI/2+k*Math.PI/5;x.lineTo(Math.cos(a)*r,Math.sin(a)*r-s*0.1)}x.fill();x.restore()}
function heart(X,Y,s,col=C.red){x.save();x.translate(X,Y);x.scale(s/30,s/30);x.fillStyle=col;x.beginPath();x.moveTo(0,10);x.bezierCurveTo(-30,-10,-15,-35,0,-18);x.bezierCurveTo(15,-35,30,-10,0,10);x.fill();x.restore()}
function phone(X,Y,s){x.save();x.translate(X,Y);x.fillStyle='#0b0f1a';rr(-s*0.5,-s,s,s*2,s*0.12);x.fill();const g=x.createLinearGradient(0,-s,0,s);g.addColorStop(0,'#2a5cff');g.addColorStop(1,'#a63bff');x.fillStyle=g;rr(-s*0.45,-s*0.93,s*0.9,s*1.86,s*0.09);x.fill();x.restore()}
function bubble(X,Y,w,h,k){sc(X,Y,k,()=>{x.save();x.shadowColor='rgba(0,0,0,.4)';x.shadowBlur=30;x.fillStyle='#fff';rr(-w/2,-h/2,w,h,40);x.fill();x.beginPath();x.moveTo(-w/2+80,h/2-2);x.lineTo(-w/2+60,h/2+60);x.lineTo(-w/2+150,h/2-2);x.fill();x.restore()})}
function pin(X,Y,s){x.save();x.translate(X,Y);x.fillStyle=C.red;x.beginPath();x.arc(0,-s,s*0.7,Math.PI*0.85,Math.PI*0.15);x.lineTo(0,0);x.closePath();x.fill();x.fillStyle='#fff';x.beginPath();x.arc(0,-s,s*0.28,0,7);x.fill();x.restore()}
function bookmark(X,Y,s,col=C.gold){x.save();x.translate(X,Y);x.fillStyle=col;x.beginPath();x.moveTo(-s*0.6,-s);x.lineTo(s*0.6,-s);x.lineTo(s*0.6,s);x.lineTo(0,s*0.5);x.lineTo(-s*0.6,s);x.closePath();x.fill();x.restore()}
function arrowUp(X,Y,h,w,col=C.green,p=1){x.save();x.fillStyle=col;const hh=h*p;rr(X-w/2,Y-hh,w,hh,10);x.fill();x.beginPath();x.moveTo(X-w*1.1,Y-hh+4);x.lineTo(X,Y-hh-w*1.2);x.lineTo(X+w*1.1,Y-hh+4);x.fill();x.restore()}
function rays(X,Y,r,t,col='rgba(245,197,24,.18)'){x.save();x.translate(X,Y);x.rotate(t*0.25);x.fillStyle=col;for(let k=0;k<16;k++){x.rotate(Math.PI/8);x.beginPath();x.moveTo(0,0);x.lineTo(r,-r*0.09);x.lineTo(r,r*0.09);x.fill()}x.restore()}
function product(X,Y,h,k=1,t=0){if(!prod.complete||k<=0)return;const w=h*prod.width/prod.height;sc(X,Y,k,()=>{x.save();x.translate(0,Math.sin(t*2)*8);
 x.fillStyle='rgba(0,0,0,.45)';x.beginPath();x.ellipse(0,h/2+10,w*0.5,24,0,0,7);x.filter='blur(14px)';x.fill();x.filter='none';
 x.drawImage(prod,-w/2,-h/2,w,h);x.restore()})}
function zzz(X,Y,t){for(let i=0;i<3;i++){const p=((t*0.6+i/3)%1);x.save();x.globalAlpha=Math.sin(p*Math.PI);txt('Z',X+p*90+i*10,Y-p*160,50+i*16,'#fff',{f:'Anton',w:400});x.restore()}}
function title(s,Y,size,col,k,opt={}){if(k<=0)return;sc(W/2,Y,k,()=>txt(s,0,0,size,col,Object.assign({f:'Anton',w:400,st:14,stc:'#03102e',sh:20},opt)))}

// ---------- scenes  [start,end,draw(t,lt)]
const S=[
[0,2.0,(t,l)=>{ // group, short guy looks up
 const z=1+l*0.04;sc(W/2,1250,z,()=>{const tall=[[-330,640],[-170,700],[170,680],[330,620]];tall.forEach(([dx,h],i)=>{const k=eo(P(l,i*0.08,0.4));person(dx,0+(1-k)*40,h*(0.85+0.15*k),'rgba(70,105,190,'+(0.85*k)+')')});
  person(0,0,380,C.gold,{look:1,tilt:-0.25})});
 pill('EL MÁS BAJITO',W/2,1330,46,C.red,'#fff',pop(l,0.5))}],
[2.0,3.6,(t,l)=>{dna(W/2,850,640,t);X_(W/2,850,190,pop(l,0.45,0.35));pill('NO ES TU GENÉTICA',W/2,1300,50,'#fff',C.navy,pop(l,0.1))}],
[3.6,7.98,(t,l)=>{head(W/2,760,170);const v=lerp(0.55,0.08,eo(P(l,0.6,1.6)));gauge(W/2,1150,230,v,'HGH','HORMONA DE CRECIMIENTO');
 zzz(W/2+150,620,t);if(l>2.8){const k=pop(l,2.86,0.35);sc(W/2,780,k*(1+0.03*Math.sin(t*10)),()=>{x.rotate(-0.12);x.strokeStyle=C.red;x.lineWidth=12;rr(-280,-70,560,140,20);x.stroke();txt('DORMIDA',0,4,110,C.red,{f:'Anton',w:400})})}}],
[7.98,12.3,(t,l)=>{ruler(250,1350,500);const g=eo(P(l,0.6,2.2));const stop=l>2.6;const h=lerp(380,stop?700:820,g);person(560,1350,Math.min(h,700),C.gold);
 if(stop){x.save();x.strokeStyle=C.red;x.lineWidth=10;x.setLineDash([26,16]);x.beginPath();x.moveTo(330,650);x.lineTo(900,650);x.stroke();x.restore();pill('STOP',780,600,48,C.red,'#fff',pop(l,2.65))}
 pill('ANTES DE TIEMPO',W/2,1440-40,44,'#fff',C.navy,pop(l,2.9))}],
[12.3,16.6,(t,l)=>{for(let i=0;i<5;i++){const k=eo(P(l,0.9+i*0.15,0.4));person(170+i*185,1250,lerp(380,520,rnd(i+3))*k,i==2?C.gold:'rgba(95,168,255,.9)')}
 arrowUp(W/2,620,260,70,C.green,eo(P(l,3.4,0.6)));pill('DESARROLLO',W/2,300+30,50,C.green,'#03231a',pop(l,3.45))}],
[16.6,20.6,(t,l)=>{const p=eo(P(l,0.3,3.2));x.save();x.fillStyle='rgba(255,255,255,.12)';rr(140,980,800,30,15);x.fill();x.fillStyle=C.gold;rr(140,980,800*p,30,15);x.fill();x.restore();
